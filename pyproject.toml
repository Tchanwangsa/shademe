[project]
name = "shademe"
version = "1.0.0"
description = "Weather-aware cool-route routing for the Melbourne CBD"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.128.8",
    "networkx==3.2.1",
    "numpy==2.0.2",
    "pandas==2.3.3",
    "pillow==11.3.0",
    "pvlib==0.13.0",
    "pyproj==3.6.1",
    "rasterio==1.4.3",
    "requests==2.32.5",
    "scipy==1.13.1",
    "shapely==2.0.7",
    "uvicorn[standard]==0.39.0",
]

[project.scripts]
shademe-api = "shademe.api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shademe"]

[tool.uv]
package = true

[dependency-groups]
notebooks = [
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
]
